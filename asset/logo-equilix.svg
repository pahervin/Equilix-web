<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" width="240" height="180">
  <!-- Soleil (jaune réaliste) -->
  <g stroke="#E67E22" stroke-width="3" stroke-linecap="round">
    <line x1="28" y1="8"  x2="28" y2="16"/>
    <line x1="6"  y1="30" x2="14" y2="30"/>
    <line x1="12" y1="14" x2="18" y2="20"/>
  </g>
  <circle cx="28" cy="30" r="11" fill="#FDB813" stroke="#E67E22" stroke-width="2"/>

  <!-- Nuage masquant partiellement le soleil -->
  <g fill="#ECF0F1" stroke="#BDC3C7" stroke-width="1.5">
    <circle cx="44" cy="24" r="8"/>
    <circle cx="56" cy="28" r="10"/>
    <ellipse cx="54" cy="36" rx="17" ry="8"/>
  </g>

  <!-- Marque Equilix : au-dessus de la balance, à droite du soleil -->
  <text x="152" y="36" text-anchor="middle"
        font-family="Segoe UI, sans-serif" font-size="24" font-weight="bold"
        fill="#2C3E50" letter-spacing="1">Equilix</text>

  <!-- Fléau INCLINÉ (panneau solaire plus bas, à gauche) -->
  <rect x="28" y="112" width="184" height="7" rx="3.5" fill="#5D6D7E"
        transform="rotate(-6 120 115.5)"/>

  <!-- Pied de la balance : hauteur réduite de moitié -->
  <rect x="116.5" y="116" width="7" height="27" fill="#5D6D7E"/>
  <ellipse cx="120" cy="144" rx="22" ry="5" fill="#5D6D7E"/>

  <!-- Repère d'équilibre au centre du fléau -->
  <polygon points="120,101 115,110 125,110" fill="#229954"/>

  <!-- Panneau solaire posé sur l'extrémité BASSE du fléau -->
  <rect x="36" y="72" width="48" height="46" fill="#1A5276" stroke="#85929E" stroke-width="2.5"/>
  <g stroke="#5DADE2" stroke-width="1.2">
    <line x1="36" y1="87.3" x2="84" y2="87.3"/>
    <line x1="36" y1="102.6" x2="84" y2="102.6"/>
    <line x1="52" y1="72"  x2="52" y2="118"/>
    <line x1="68" y1="72"  x2="68" y2="118"/>
  </g>

  <!-- Maison posée sur l'extrémité HAUTE du fléau -->
  <rect x="158" y="71" width="48" height="34" fill="#F6E7C1" stroke="#8D6E63" stroke-width="1.5"/>
  <polygon points="152,71 182,49 212,71" fill="#B03A2E" stroke="#7B241C" stroke-width="1"/>
  <!-- Éclair = consommation électrique -->
  <polygon points="186,75 177,87 183,87 178,97 192,83 185,83 190,75" fill="#F39C12"/>
</svg>